# LTL Guardrail Harness dashboard — reverse proxy to the Python server.
# Exposed on port 8080 (all interfaces); upstream binds localhost only.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    access_log /var/log/nginx/ltl-harness.access.log;
    error_log  /var/log/nginx/ltl-harness.error.log;

    location / {
        proxy_pass http://127.0.0.1:8471;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

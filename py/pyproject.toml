[project]
name = "ltl-harness"
version = "0.2.0"
description = "Temporal-logic guardrails for Claude Agent SDK agents — LTLf2DFA-compiled colored automata enforced via hooks."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "claude-agent-sdk",
    "ltlf2dfa>=2.0.0", # 2.x moved to modern lark, so it shares a venv with nl2ltl
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]
nl = ["nl2ltl"]        # design-time NL -> LTLf translator (ltl_harness.nl2rules)

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
